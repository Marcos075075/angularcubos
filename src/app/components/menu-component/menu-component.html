<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <a href="#" class="text-xl font-bold tracking-tight text-slate-900">
      Angular<span class="text-indigo-600">Cubos</span>
    </a>

    <ul class="flex items-center gap-8">
      <li>{{ user()?.email }}</li>

      <li>
        <a
          [routerLink]="['/']"
          class="text-sm font-medium text-slate-600 transition hover:text-indigo-600"
        >
          Inicio
        </a>
      </li>
      <li class="group relative">
        <button
          type="button"
          class="flex items-center gap-2 text-sm font-medium text-slate-600 transition hover:text-indigo-600"
        >
          Marcas
          <span class="text-xs">▼</span>
        </button>
        <ul
          class="invisible absolute left-1/2 top-full z-10 mt-3 w-52 -translate-x-1/2 rounded-xl border border-slate-200 bg-white p-2 opacity-0 shadow-xl ring-1 ring-slate-900/5 transition-all duration-200 group-hover:visible group-hover:opacity-100 group-focus-within:visible group-focus-within:opacity-100"
        >
          @for (marc of marcas; track marcas) {
            <li>
              <a
                [routerLink]="['/marcas', marc]"
                class="block rounded-lg px-4 py-2.5 text-sm font-medium capitalize text-slate-600 transition-colors hover:bg-indigo-50 hover:text-indigo-700 focus:bg-indigo-50 focus:text-indigo-700 focus:outline-none"
              >
                {{ marc }}
              </a>
            </li>
          }
        </ul>
      </li>
      <li>
        <a
          [routerLink]="['/compras']"
          class="text-sm font-medium text-slate-600 transition hover:text-indigo-600"
        >
          Compras
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/comprar']"
          class="text-sm font-medium text-slate-600 transition hover:text-indigo-600"
        >
          Comprar Cubos
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/login']"
          class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700"
        >
          Iniciar sesión
        </a>
      </li>

      <li>
        <button
          (click)="logOutAsync()"
          type="button"
          class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700"
        >
          Cerrar sesión
        </button>
      </li>
    </ul>
  </nav>
</header>
