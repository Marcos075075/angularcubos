<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900">Cubos disponibles</h1>
    <p class="mt-2 text-slate-600">Elige tu próximo cubo favorito.</p>
  </div>

  @if (mensaje) {
    <p class="mb-8 rounded-lg border border-indigo-100 bg-indigo-50 px-4 py-3 font-medium text-indigo-700">
      {{ mensaje }}
    </p>
  }

  <section class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (cub of cubos; track cub.idCubo) {
      <div class="list-none">
        <app-hijo-cubos-component
          (seleccionarFavoritoPadre)="seleccionarFavoritoPadre($event)"
          [cubo]="cub"
        >
        </app-hijo-cubos-component>
      </div>
    }
  </section>
</main>
