<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mb-8">
    <p class="text-sm font-medium uppercase tracking-wide text-indigo-600">Catálogo</p>
    <h1 class="mt-1 text-3xl font-bold text-slate-900">
      Cubos de la marca {{ marca }}
    </h1>
  </div>

  <section class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (cub of cubos; track cub.idCubo) {
      <article class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-md">
        <img
          [src]="cub.imagen"
          [alt]="cub.nombre"
          class="h-56 w-full bg-slate-50 object-contain p-4"
        />
        <div class="p-5">
          <h2 class="text-lg font-semibold text-slate-900">{{ cub.nombre }}</h2>
          <p class="mt-2 text-sm text-slate-500">{{ cub.modelo }}</p>
          <p class="mt-4 text-xl font-bold text-slate-900">{{ cub.precio }} €</p>
        </div>
      </article>
    }
  </section>
</main>
