<main class="flex min-h-[calc(100vh-73px)] items-center justify-center bg-slate-50 px-4 py-12">
  <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="mb-8">
      <p class="text-sm font-medium uppercase tracking-wide text-indigo-600">Tienda</p>
      <h1 class="mt-1 text-3xl font-bold text-slate-900">Comprar cubo</h1>
      <p class="mt-2 text-slate-500">Selecciona el cubo que quieres comprar.</p>
    </div>

    <form #comprarForm="ngForm" class="space-y-5">
      <div>
        <label for="cajacompra" class="mb-2 block text-sm font-medium text-slate-700">
          Cubo
        </label>
        <select
          id="cajacompra"
          #cajacompra
          name="cajacompra"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
        >
          @for (cubo of cubos; track cubo.idCubo) {
            <option [value]="cubo.idCubo">{{cubo.idCubo}}</option>
          }
        </select>
      </div>

      <button
        type="button"
        (click)="comprarAsync()"
        class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        Comprar cubo
      </button>
    </form>
  </section>
</main>
